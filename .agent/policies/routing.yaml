# Model routing preferences.
# These are preferences, not permanent provider-role bindings.
# Capability, availability, risk evidence and budget may justify fallback.

defaults:
  preferred_root:
    - codex
    - claude
    - deepseek
  preferred_worker:
    - deepseek
    - codex
    - claude
  preferred_architecture_consultant:
    - claude
    - codex
  preferred_difficult_diagnosis:
    - claude
    - codex
  preferred_ambiguity_resolver:
    - claude
    - codex
  preferred_high_risk_reviewer:
    - claude
    - codex

risk:
  low:
    preferred_root:
      - codex
      - deepseek
      - claude
    preferred_worker:
      - deepseek
      - codex
      - claude
    independent_review: false

  medium:
    preferred_root:
      - codex
      - claude
      - deepseek
    preferred_worker:
      - deepseek
      - codex
      - claude
    preferred_specialist:
      - claude
      - codex
    preferred_reviewer:
      - claude
      - codex
    independent_review: conditional

  high:
    preferred_root:
      - codex
      - claude
      - deepseek
    preferred_worker:
      - deepseek
      - codex
      - claude
    preferred_specialist:
      - claude
      - codex
    preferred_reviewer:
      - claude
      - codex
    independent_review: required
    reviewer_independence: required

principles:
  - use_cheapest_capable_resource
  - prefer_deterministic_tools_before_model_calls
  - codex_is_default_root_preference
  - deepseek_is_preferred_for_well_scoped_worker_tasks
  - claude_is_preferred_for_premium_specialist_work
  - preserve_premium_capacity_for_high_value_reasoning
  - allow_provider_fallback
  - do_not_permanently_bind_provider_to_role
