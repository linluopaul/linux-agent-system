# Retry policy intentionally kept minimal during manual workflow phase.
#
# Do not define complex retry counts or backoff rules before collecting
# evidence from real multi-agent tasks.
#
# Future Controller policy should distinguish at least:
#
# - process crash
# - transient provider failure
# - rate limit / quota constraint
# - verification failure
# - repeated implementation failure
#
# Provider constraints should allow routing to a fallback provider.
#
# Repeated or non-transient failures should be escalated rather than
# blindly retried.
#
# Quantitative retry limits will be defined after manual workflow data
# has been collected.
#
# Review-cycle budget (AMENDMENT 1). risk.yaml is the SOLE authority for WHETHER independent
# review is required and is NOT edited here. This file governs only HOW MANY review/fix/
# re-review cycles are allowed AFTER review has already been required by risk/task policy.
# It must never make review required itself, and HIGH-risk work is governed by risk.yaml
# (which may justify more review, never fewer). Unlimited review/fix loops are forbidden.

# Review loop ceiling (v3). The Execution Lead arranges the review itself and runs the
# review/fix/re-review loop without returning to the Root for each cycle. This ceiling is
# the hard cap on that loop for ANY risk level. It does not decide whether review happens
# (risk.yaml alone decides that); it only bounds a loop that has already been required.
# On exhaustion the Lead MUST stop editing and re-engage the Root under closed re-entry
# condition 4. Per-level budgets below may be tighter than this ceiling, never looser.
review_loop:
  max_cycles: 3
  counts: one_review_pass_plus_the_fix_that_answers_it
  on_exhaustion: stop_and_return_to_root
  lead_may_continue_editing_after_exhaustion: false

# Root's options on exhaustion of the MEDIUM budget: continue the current harness, change
# strategy, escalate to Codex Premium, or amend acceptance/tests.
review_budget:
  medium:
    applies_when_review_is_required: true
    initial_review: 1
    fix_cycles: 1
    focused_re_reviews: 1
    on_further_blocking: return_to_root_for_diagnosis

execution_lead_failure:
  lifecycle_recovery_owner: root_parent_run_coordinator
  resumed_edit_verify_loop_owner: replacement_execution_lead
  worktree_policy: preserve_until_prior_terminal_is_inactive_and_ownership_is_reassigned
  uncommitted_work_policy: preserve_and_transfer_to_replacement_execution_lead
